<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>经营看板 · 问答 · 调试</title>
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">M</span>
    <span class="brand-text">
      <strong>经营看板</strong>
      <small id="health-line" class="muted">正在读取服务状态…</small>
    </span>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab is-active" type="button" data-tab="dash">经营看板</button>
    <button class="tab" type="button" data-tab="qa">问答</button>
    <button class="tab" type="button" data-tab="debug">调试面板</button>
  </nav>
</header>

<main class="page">

  <!-- ============================ 标签 1：经营看板 ============================ -->
  <section class="view is-active" id="view-dash">
    <div class="card filters">
      <div class="field">
        <label for="f-start">开始日期</label>
        <input type="date" id="f-start">
      </div>
      <div class="field">
        <label for="f-end">结束日期</label>
        <input type="date" id="f-end">
      </div>
      <div class="field">
        <label for="f-store">门店</label>
        <select id="f-store" disabled><option value="">全部门店</option></select>
      </div>
      <div class="field">
        <label for="f-product">商品</label>
        <select id="f-product" disabled><option value="">全部商品</option></select>
      </div>
      <div class="field field-actions">
        <button class="btn btn-primary" id="btn-query" type="button">查询</button>
        <button class="btn" id="btn-reset" type="button">重置区间</button>
      </div>
      <div class="field field-note">
        <span class="muted" id="range-note">—</span>
      </div>
    </div>

    <div class="cards" id="metric-cards"></div>

    <div class="card">
      <div class="card-head">
        <h2>营业额趋势</h2>
        <span class="muted" id="trend-note"></span>
      </div>
      <div class="chart-wrap" id="trend-wrap">
        <svg id="trend-svg" role="img" aria-label="每日净营业额折线图"></svg>
        <div class="tooltip" id="trend-tip" hidden></div>
      </div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-head">
          <h2>Top 10 商品</h2>
          <span class="muted" id="top-note"></span>
        </div>
        <div class="table-scroll">
          <table class="table" id="top-table">
            <thead>
              <tr>
                <th>#</th><th>商品</th><th>品类</th>
                <th class="num">净营业额</th><th class="num">订单数</th><th class="num">销量</th>
              </tr>
            </thead>
            <tbody><tr><td colspan="6" class="muted">加载中…</td></tr></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <div class="card-head">
          <h2>数据质量</h2>
          <span class="muted" id="dq-note"></span>
        </div>
        <div id="dq-body"><p class="muted">加载中…</p></div>
      </div>
    </div>
  </section>

  <!-- ============================== 标签 2：问答 ============================== -->
  <section class="view" id="view-qa">
    <div class="card qa-head">
      <div class="field grow">
        <label for="qa-input">提问</label>
        <input type="text" id="qa-input" placeholder="例如：7 月整体的净营业额是多少？" autocomplete="off">
      </div>
      <div class="field field-actions">
        <button class="btn btn-primary" id="btn-ask" type="button">发送</button>
        <button class="btn" id="btn-new-session" type="button">新会话</button>
      </div>
      <div class="field field-note">
        <span class="muted" id="qa-session"></span>
      </div>
    </div>
    <div id="qa-thread" class="thread"></div>
  </section>

  <!-- ============================ 标签 3：调试面板 ============================ -->
  <section class="view" id="view-debug">
    <div class="card filters">
      <div class="field grow">
        <label for="trace-input">trace_id</label>
        <input type="text" id="trace-input" placeholder="例如：t-20260901-0001" autocomplete="off">
      </div>
      <div class="field field-actions">
        <button class="btn btn-primary" id="btn-load-trace" type="button">加载</button>
      </div>
      <div class="field field-note">
        <span class="muted">问答页每条回答旁的「看调试」会自动填这里。</span>
      </div>
    </div>
    <div id="trace-body"><p class="muted">还没有加载 trace。先去问答页问一句，或直接填一个 trace_id。</p></div>
  </section>

</main>

<script src="/static/js/util.js"></script>
<script src="/static/js/dashboard.js"></script>
<script src="/static/js/chat.js"></script>
<script src="/static/js/trace.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
